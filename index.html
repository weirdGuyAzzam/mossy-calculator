<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>js-calc</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="main-comp">
            <input readonly id="display" />
            <div id="keys">
                <button class="calc-button" data-value="1">
                    1
                </button>
                <button class="calc-button" data-value="2">
                    2
                </button>
                <button class="calc-button" data-value="3">
                    3
                </button>
                <button class="calc-button" data-value="4">
                    4
                </button>
                <button class="calc-button" data-value="5">
                    5
                </button>
                <button class="calc-button" data-value="6">
                    6
                </button>
                <button class="calc-button" data-value="7">
                    7
                </button>
                <button class="calc-button" data-value="8">
                    8
                </button>
                <button class="calc-button" data-value="9">
                    9
                </button>
                <button class="calc-button" data-value="0">
                    0
                </button>
                <button class="calc-button" data-value=".">
                    .
                </button>
                <button class="calc-button" data-value="-"="substract">
                    -
                </button>
                <button class="calc-button" data-value="+"="add">
                    +
                </button>
                <button class="calc-button" data-value="/"="divide">
                    /
                </button>
                <button class="calc-button" data-value="*"="multiplied">
                    *
                </button>
                <button class="calc-button" data-action="calculate">=</button>
                <button class="calc-button" data-action="clearMemory">C</button>
                <button class="calc-button" data-action="delete">&#9003</button>
            </div>
        </div>
        <script src="app.js"></script>
    </body>
</html>
